model: Llama-3.3-70B-Instruct-FP8
label:
  en_US: Llama 3.3 70B Instruct
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 65536
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
pricing:
  input: "0.135"
  output: "0.4"
  unit: "0.000001"
  currency: USD
