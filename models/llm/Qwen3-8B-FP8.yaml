model: Qwen3-8B-FP8
label:
  en_US: Qwen 3 8B
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 40960
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 40960
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
pricing:
  input: "0.117"
  output: "0.455"
  unit: "0.000001"
  currency: USD
