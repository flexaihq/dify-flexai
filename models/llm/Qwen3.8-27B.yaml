model: Qwen3.8-27B
label:
  en_US: Qwen3.8 27B
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 65536
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
pricing:
  input: "0.15"
  output: "1.875"
  unit: "0.000001"
  currency: USD
