model: NVIDIA-Nemotron-3.5-Lightning-30B-A3B
label:
  en_US: Nemotron 3.5 Lightning 30B A3B
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 65536
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
pricing:
  input: "0.08"
  output: "0.2"
  unit: "0.000001"
  currency: USD
