model: Muse-Glimmer-30B
label:
  en_US: Muse Glimmer 30B
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 65536
pricing:
  input: "0.3"
  output: "1.2"
  unit: "0.000001"
  currency: USD
